<section id="apresentacao" class="hero section-grid">
  <div
    class="hero-copy"
    appScrollReveal=".eyebrow, h1, .hero-text, .hero-actions a"
    [appScrollRevealY]="24"
    [appScrollRevealDuration]="0.64"
    [appScrollRevealStagger]="0.06"
    appScrollRevealStart="top 88%"
  >
    <p class="eyebrow" [appScrambleText]="'Portfólio Web / Etapa 01' | translate">{{ 'Portfólio Web / Etapa 01' | translate }}</p>
    <h1>{{ 'Desenvolvedor full-stack criando aplicações web.' | translate }}</h1>
    <p class="hero-text" >{{ (profile().intro) | translate }}</p>

    <div class="hero-actions" [attr.aria-label]="'Acoes principais' | translate">
      <a class="button button-primary" href="mailto:bc.luizo@gmail.com" appHoverLift [appHoverLiftY]="-3">
        {{ 'Entrar em contato' | translate }}
      </a>
      <a class="button button-secondary" href="#projetos" appHoverLift [appHoverLiftY]="-3">
        {{ 'Ver projetos' | translate }}
      </a>
    </div>
  </div>

  <app-terminal-panel [owner]="profile().name" [role]="profile().role | translate" />
</section>
